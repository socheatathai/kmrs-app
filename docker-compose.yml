version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kmrs-postgres
    environment:
      POSTGRES_USER: kmrs_user
      POSTGRES_PASSWORD: kmrs_password
      POSTGRES_DB: kmrs_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmrs_user -d kmrs_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kmrs-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
